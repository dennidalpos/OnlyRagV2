name: OnlyRag V2 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: 'pip'

      - name: Install Node Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE." }

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'sidecar/requirements-dev.txt')) {
            throw 'Required sidecar dependency file not found: sidecar/requirements-dev.txt'
          }
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit code $LASTEXITCODE." }
          python -m pip install -r sidecar/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed with exit code $LASTEXITCODE." }

      - name: Run Serial Quality & Lint Script (Fail-Fast)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/lint_format.ps1 -Fast

      - name: Run Coverage Gate (Fail-Fast)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run test:coverage
          if ($LASTEXITCODE -ne 0) { throw "Coverage gate failed with exit code $LASTEXITCODE." }

      - name: Run Sidecar & LanceDB Tests (Fail-Fast)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/test_sidecar_health.ps1 -Fast
