<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowH" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b1" />
      <feGaussianBlur stdDeviation="12" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="nodeGradH" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </radialGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="1000" height="300" rx="24" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Logo Group on the left (Center at X: 150, Y: 150) -->
  <g transform="translate(150, 150) scale(0.65)" filter="url(#glowH)">
    <circle cx="0" cy="0" r="160" fill="#0369a1" opacity="0.15" />
    <ellipse cx="0" cy="0" rx="55" ry="145" fill="none" stroke="url(#cyanGrad)" stroke-width="11" stroke-linecap="round" />
    <ellipse cx="0" cy="0" rx="55" ry="145" fill="none" stroke="url(#cyanGrad)" stroke-width="11" stroke-linecap="round" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="55" ry="145" fill="none" stroke="url(#cyanGrad)" stroke-width="11" stroke-linecap="round" transform="rotate(120)" />

    <circle cx="75" cy="-70" r="13" fill="url(#nodeGradH)" stroke="#0f172a" stroke-width="3" />
    <circle cx="-105" cy="-25" r="13" fill="url(#nodeGradH)" stroke="#0f172a" stroke-width="3" />
    <circle cx="20" cy="115" r="13" fill="url(#nodeGradH)" stroke="#0f172a" stroke-width="3" />
    <circle cx="0" cy="0" r="22" fill="url(#nodeGradH)" stroke="#0f172a" stroke-width="3.5" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(310, 130)">
    <!-- Main Title -->
    <text x="0" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      Only<tspan fill="url(#cyanGrad)">Rag</tspan>
      <tspan fill="#38bdf8" font-size="48" font-weight="700" dx="12">V2</tspan>
    </text>

    <!-- Subtitle -->
    <text x="5" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="2">
      AUTONOMOUS AI &amp; LOCAL RAG STUDIO
    </text>

    <!-- Tech Badges -->
    <g transform="translate(5, 100)" font-family="monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="80" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#0891b2" stroke-width="1"/>
      <text x="12" y="16" fill="#67e8f9">OLLAMA</text>

      <rect x="92" y="0" width="88" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="104" y="16" fill="#94a3b8">LANCEDB</text>

      <rect x="192" y="0" width="88" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="204" y="16" fill="#94a3b8">FASTAPI</text>

      <rect x="292" y="0" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="304" y="16" fill="#94a3b8">ELECTRON 43</text>
    </g>
  </g>
</svg>
