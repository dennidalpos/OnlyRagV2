<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Cyan Stroke Gradient -->
    <linearGradient id="neonCyanTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowTrans" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="nucleusGradTrans" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Atomic Structure -->
  <circle cx="256" cy="256" r="140" fill="#0891b2" opacity="0.2" filter="url(#neonGlowTrans)" />

  <!-- Atomic Orbital Rings Group -->
  <g filter="url(#neonGlowTrans)">
    <!-- Vertical Orbit (0 deg) -->
    <ellipse cx="256" cy="256" rx="72" ry="180" fill="none" stroke="url(#neonCyanTrans)" stroke-width="14" stroke-linecap="round" />

    <!-- Tilted Orbit (60 deg) -->
    <ellipse cx="256" cy="256" rx="72" ry="180" fill="none" stroke="url(#neonCyanTrans)" stroke-width="14" stroke-linecap="round" transform="rotate(60 256 256)" />

    <!-- Tilted Orbit (120 deg) -->
    <ellipse cx="256" cy="256" rx="72" ry="180" fill="none" stroke="url(#neonCyanTrans)" stroke-width="14" stroke-linecap="round" transform="rotate(120 256 256)" />

    <!-- Electron Node Spheres -->
    <!-- Node 1 -->
    <circle cx="360" cy="162" r="16" fill="url(#nucleusGradTrans)" stroke="#0f172a" stroke-width="3.5" />

    <!-- Node 2 -->
    <circle cx="132" cy="220" r="16" fill="url(#nucleusGradTrans)" stroke="#0f172a" stroke-width="3.5" />

    <!-- Node 3 -->
    <circle cx="285" cy="408" r="16" fill="url(#nucleusGradTrans)" stroke="#0f172a" stroke-width="3.5" />

    <!-- Central Nucleus -->
    <circle cx="256" cy="256" r="28" fill="url(#nucleusGradTrans)" stroke="#0f172a" stroke-width="4" />
  </g>
</svg>
