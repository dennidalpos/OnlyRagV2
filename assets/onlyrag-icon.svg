<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Neon Cyan Stroke Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="nucleusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </radialGradient>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#badgeBorder)" stroke-width="8" />

  <!-- Ambient Glow Behind Atomic Structure -->
  <circle cx="256" cy="256" r="140" fill="#0891b2" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Atomic Orbital Rings Group -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Orbit (0 deg) -->
    <ellipse cx="256" cy="256" rx="66" ry="160" fill="none" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" />

    <!-- Tilted Orbit (60 deg) -->
    <ellipse cx="256" cy="256" rx="66" ry="160" fill="none" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" transform="rotate(60 256 256)" />

    <!-- Tilted Orbit (120 deg) -->
    <ellipse cx="256" cy="256" rx="66" ry="160" fill="none" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" transform="rotate(120 256 256)" />

    <!-- Electron Node Spheres -->
    <!-- Node 1 (Top-Right on 60 deg orbit) -->
    <circle cx="348" cy="172" r="14" fill="url(#nucleusGrad)" stroke="#0f172a" stroke-width="3" />

    <!-- Node 2 (Left on 120 deg orbit) -->
    <circle cx="145" cy="225" r="14" fill="url(#nucleusGrad)" stroke="#0f172a" stroke-width="3" />

    <!-- Node 3 (Bottom-Right on 0 deg / vertical orbit) -->
    <circle cx="282" cy="392" r="14" fill="url(#nucleusGrad)" stroke="#0f172a" stroke-width="3" />

    <!-- Central Nucleus -->
    <circle cx="256" cy="256" r="24" fill="url(#nucleusGrad)" stroke="#0f172a" stroke-width="4" />
  </g>
</svg>
