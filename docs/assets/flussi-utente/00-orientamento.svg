<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1543" viewBox="0 0 360 1543" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">00 · Cosa vuoi fare?</title>
<desc id="desc">Per importare, revisionare, esportare o cercare documenti: Ingestione Doc, percorsi 02–07. Per conversare e verificare le fonti: RAG &amp; Chat, percorsi 08–10. Per cambiare lingua a un documento: Traduzione, percorsi 11–13. Per analizzare o modificare un progetto: Coding Agent, percorsi 14–20. Per configurare ambiente e preferenze: Impostazioni, percorsi 21–25.</desc>
