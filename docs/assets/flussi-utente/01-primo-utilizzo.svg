</g>
<g id="n3" data-node="q">
<polygon points="180,535 296,609.5 180,684 64,609.5" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="588.5">Servizi</tspan><tspan x="180" y="609.5">necessari</tspan><tspan x="180" y="630.5">pronti?</tspan></text>
</g>
<g id="n4" data-node="a">
<rect x="46" y="740" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="764.5">Verifica i modelli</tspan><tspan x="180" y="785.5">assegnati → 23</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="866" width="268" height="64" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="898">Scegli una funzione → 00</tspan></text>
</g>
