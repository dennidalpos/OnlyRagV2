<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="1010.5">Configura server → 22;</tspan><tspan x="180" y="1031.5">consulta log → 25</tspan></text>
</g>
