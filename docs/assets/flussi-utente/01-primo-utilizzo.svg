<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1208" viewBox="0 0 360 1208" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">01 · Primo utilizzo e servizi</title>
<desc id="desc">Se compare un errore di lettura delle impostazioni, usa Riprova. Il file originale non viene sostituito e la diagnostica automatica resta sospesa. Controlla Ollama Server per le generazioni e LanceDB Sidecar per le operazioni documentali. Se un servizio manca, segui 22 o consulta i log in 25. Usa Setup Wizard Hardware &amp; Modelli o assegna i modelli in 23; quindi torna alla funzione desiderata.</desc>
