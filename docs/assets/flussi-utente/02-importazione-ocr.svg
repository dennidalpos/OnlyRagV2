<svg xmlns="http://www.w3.org/2000/svg" width="360" height="904" viewBox="0 0 360 904" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">02 · Importare un documento</title>
<desc id="desc">Scegli OCR Nativo (RapidOCR / ONNX) oppure Vision LLM Multimodale (Ollama Vision) nelle Impostazioni. Con Vision, seleziona un modello compatibile; il selettore rapido e System Prompt sono disponibili anche nella vista di ingestione. Con OCR Nativo il badge indica GPU ON, GPU Presente (ONNX CPU) o CPU. Premi Sfoglia File da Caricare o trascina file locali. Più file vengono elaborati in sequenza. Annullare la selezione non avvia l’importazione. Segui estrazione, OCR e indicizzazione. Annulla operazione richiede l’interruzione: attendi il messaggio finale, senza considerare completo un task annullato. Con esito positivo il documento compare nell’elenco: se compare Vettorizzazione in modalità fallback:, verifica il modello di embedding e usa Re-indicizza Vettori; poi passa a 04. Con errore controlla il messaggio e i servizi prima di riprovare; se appare una revisione, passa a 03.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
<rect width="360" height="904" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="25" font-size="14" letter-spacing="0.5" fill="#526779">ONLYRAG V2 / GUIDA UTENTE</text>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">02 · Importare un documento</tspan></text>
<g id="n0" data-node="s">
<rect x="46" y="101" width="268" height="64" rx="30" fill="#183249" stroke="#183249" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#ffffff"><tspan x="180" y="133">Apri Ingestione Doc</tspan></text>
</g>
<g id="n1" data-node="a">
<rect x="46" y="221" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="245.5">Verifica la scelta OCR in</tspan><tspan x="180" y="266.5">Impostazioni → 23</tspan></text>
</g>
<g id="n2" data-node="a">
<rect x="46" y="347" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="371.5">Sfoglia File da Caricare</tspan><tspan x="180" y="392.5">oppure trascina i file</tspan></text>
</g>
<g id="n3" data-node="q">
<polygon points="180,473 296,539 180,605 64,539" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="528.5">Operazione</tspan><tspan x="180" y="549.5">riuscita?</tspan></text>
</g>
<g id="n4" data-node="t">
<rect x="46" y="661" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="685.5">Documento indicizzato:</tspan><tspan x="180" y="706.5">revisiona → 04</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="787" width="268" height="91" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="811.5">Errore, revisione o</tspan><tspan x="180" y="832.5">annullamento: controlla</tspan><tspan x="180" y="853.5">l’esito → 03</tspan></text>
</g>
