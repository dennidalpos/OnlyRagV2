<svg xmlns="http://www.w3.org/2000/svg" width="360" height="946" viewBox="0 0 360 946" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">03 · Revisione ed errori di importazione</title>
<desc id="desc">Se compare Normalizzazione: revisione richiesta, espandi Mostra il testo estratto originale ed esamina i motivi segnalati. Usa Esporta originale Markdown; controlla che l’esportazione sia riuscita prima di chiudere il pannello. Annullare il salvataggio non conserva una nuova copia. Questa bozza non è salvata né indicizzata. Il pannello consente lettura ed esportazione, non l’approvazione o l’indicizzazione diretta: conserva il testo e prepara una nuova importazione dopo la revisione. Con un errore ordinario correggi la causa indicata; dopo un annullamento verificato puoi avviare una nuova importazione da 02.</desc>
