<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1092" viewBox="0 0 360 1092" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">05 · Copiare o esportare un documento</title>
<desc id="desc">Per usare gli appunti premi Copia MD; per creare un file scegli Esporta PDF o Esporta Markdown. L’esportazione usa il contenuto corrente dell’editor, anche se modificato. Segui il dialogo di salvataggio e attendi l’esito. Se annulli o ricevi un errore, non considerare la copia salvata: riprova. Con esito positivo apri il file e controllalo; il salvataggio nel database resta un’azione separata, descritta in 04.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
<rect width="360" height="1092" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="25" font-size="14" letter-spacing="0.5" fill="#526779">ONLYRAG V2 / GUIDA UTENTE</text>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">05 · Copiare o esportare un</tspan><tspan x="180" y="74">documento</tspan></text>
<g id="n0" data-node="s">
<rect x="46" y="122" width="268" height="64" rx="30" fill="#183249" stroke="#183249" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#ffffff"><tspan x="180" y="154">Controlla il testo corrente</tspan></text>
</g>
<g id="n1" data-node="q">
<polygon points="180,242 296,308 180,374 64,308" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="308">Serve un file?</tspan></text>
</g>
<g id="n2" data-node="a">
<rect x="46" y="430" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="454.5">Esporta PDF oppure Esporta</tspan><tspan x="180" y="475.5">Markdown</tspan></text>
</g>
<g id="n3" data-node="q">
<polygon points="180,556 296,622 180,688 64,622" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="611.5">Esportazione</tspan><tspan x="180" y="632.5">riuscita?</tspan></text>
</g>
<g id="n4" data-node="t">
<rect x="46" y="744" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="768.5">Apri e verifica il file</tspan><tspan x="180" y="789.5">salvato</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="870" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="894.5">Annullata o fallita:</tspan><tspan x="180" y="915.5">nessuna conferma; riprova</tspan></text>
</g>
<g id="n6" data-node="t">
<rect x="46" y="996" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="1020.5">Copia MD: usa il testo</tspan><tspan x="180" y="1041.5">dagli appunti</tspan></text>
</g>
