<svg xmlns="http://www.w3.org/2000/svg" width="360" height="919" viewBox="0 0 360 919" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">06 · Cercare nei passaggi indicizzati</title>
<desc id="desc">In Ingestione Doc, sotto Test Ricerca Vettoriale, premi Apri Inspector Vettoriale. Inserisci una domanda o termini di ricerca, scegli 3, 5, 10 o 20 risultati e premi Cerca Chunk. L’inspector cerca nell’indice: il filtro per nome della lista documenti non limita questa ricerca. Leggi i passaggi recuperati. Se non ci sono risultati o compare un errore, controlla indicizzazione, servizi e formulazione della domanda. Chiudi l’inspector per tornare ai documenti; usa 08 per formulare una risposta con l’assistente.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
<rect width="360" height="919" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="25" font-size="14" letter-spacing="0.5" fill="#526779">ONLYRAG V2 / GUIDA UTENTE</text>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">06 · Cercare nei passaggi</tspan><tspan x="180" y="74">indicizzati</tspan></text>
<g id="n0" data-node="s">
<rect x="46" y="122" width="268" height="64" rx="30" fill="#183249" stroke="#183249" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#ffffff"><tspan x="180" y="154">Apri Inspector Vettoriale</tspan></text>
</g>
<g id="n1" data-node="a">
<rect x="46" y="242" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="266.5">Scrivi la ricerca e scegli</tspan><tspan x="180" y="287.5">il numero di risultati</tspan></text>
</g>
<g id="n2" data-node="a">
<rect x="46" y="368" width="268" height="64" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="400">Premi Cerca Chunk</tspan></text>
</g>
<g id="n3" data-node="q">
<polygon points="180,488 296,554 180,620 64,554" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="543.5">Passaggi</tspan><tspan x="180" y="564.5">disponibili?</tspan></text>
</g>
<g id="n4" data-node="t">
<rect x="46" y="676" width="268" height="91" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="700.5">Leggi gli estratti;</tspan><tspan x="180" y="721.5">approfondisci in RAG &amp; Chat</tspan><tspan x="180" y="742.5">→ 08</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="823" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="847.5">Controlla errore, indice e</tspan><tspan x="180" y="868.5">domanda; riprova</tspan></text>
</g>
