<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1233" viewBox="0 0 360 1233" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">07 · Eliminare un documento dall’indice</title>
<desc id="desc">Individua il documento con Filtra per nome documento… e premi l’icona Elimina sulla riga. Premi Conferma per inviare la cancellazione oppure Annulla per lasciare il documento nell’elenco. Con esito positivo documento e vettori non sono più disponibili nell’indice. Con errore leggi Documento non eliminato, verifica il Sidecar e riprova.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
<rect width="360" height="1233" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="25" font-size="14" letter-spacing="0.5" fill="#526779">ONLYRAG V2 / GUIDA UTENTE</text>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">07 · Eliminare un documento</tspan><tspan x="180" y="74">dall’indice</tspan></text>
<g id="n0" data-node="s">
<rect x="46" y="122" width="268" height="64" rx="30" fill="#183249" stroke="#183249" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#ffffff"><tspan x="180" y="154">Filtra per nome documento</tspan></text>
</g>
<g id="n1" data-node="a">
<rect x="46" y="242" width="268" height="64" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="274">Premi Elimina sul documento</tspan></text>
</g>
<g id="n2" data-node="q">
<polygon points="180,362 296,428 180,494 64,428" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="428">Confermi?</tspan></text>
</g>
<g id="n3" data-node="a">
<rect x="46" y="550" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="574.5">Premi Conferma e attendi</tspan><tspan x="180" y="595.5">l’esito</tspan></text>
</g>
<g id="n4" data-node="q">
<polygon points="180,676 296,742 180,808 64,742" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="731.5">Eliminazione</tspan><tspan x="180" y="752.5">riuscita?</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="864" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="888.5">Documento e vettori rimossi</tspan><tspan x="180" y="909.5">dall’indice</tspan></text>
</g>
<g id="n6" data-node="t">
<rect x="46" y="990" width="268" height="91" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="1014.5">Documento non eliminato:</tspan><tspan x="180" y="1035.5">controlla l’errore e</tspan><tspan x="180" y="1056.5">riprova</tspan></text>
</g>
<g id="n7" data-node="t">
<rect x="46" y="1137" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="1161.5">Annulla: documento</tspan><tspan x="180" y="1182.5">conservato</tspan></text>
</g>
<path data-edge="0-1" d="M 180 188 V 239" fill="none" stroke="#526779" stroke-width="1.5" marker-end="url(#arrow)"/>
<path data-edge="1-2" d="M 180 308 V 359" fill="none" stroke="#526779" stroke-width="1.5" marker-end="url(#arrow)"/>
<path data-edge="2-3" d="M 180 496 V 547" fill="none" stroke="#526779" stroke-width="1.5" marker-end="url(#arrow)"/>
<g data-branch="2-3"><rect x="183" y="511" width="42" height="20" fill="#ffffff"/><text text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#183249"><tspan x="204" y="521">Sì</tspan></text></g>
<path data-edge="2-7" d="M 298 428 H 346 V 1109 H 180 V 1134" fill="none" stroke="#526779" stroke-width="1.5" marker-end="url(#arrow)"/>
<g data-branch="2-7"><rect x="300" y="399.0" width="42" height="20" fill="#ffffff"/><text text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#183249"><tspan x="321" y="409">No</tspan></text></g>
<path data-edge="3-4" d="M 180 622 V 673" fill="none" stroke="#526779" stroke-width="1.5" marker-end="url(#arrow)"/>
<path data-edge="4-5" d="M 180 810 V 861" fill="none" stroke="#526779" stroke-width="1.5" marker-end="url(#arrow)"/>
<g data-branch="4-5"><rect x="183" y="825" width="42" height="20" fill="#ffffff"/><text text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#183249"><tspan x="204" y="835">Sì</tspan></text></g>
<path data-edge="4-6" d="M 62 742 H 14 V 962 H 180 V 987" fill="none" stroke="#526779" stroke-width="1.5" marker-end="url(#arrow)"/>
<g data-branch="4-6"><rect x="18" y="713.0" width="42" height="20" fill="#ffffff"/><text text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="400" fill="#183249"><tspan x="39" y="723">No</tspan></text></g>
</g>
</svg>
