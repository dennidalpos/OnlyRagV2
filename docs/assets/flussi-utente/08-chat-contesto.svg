<rect x="46" y="556" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="580.5">Scrivi la domanda e premi</tspan><tspan x="180" y="601.5">Invia</tspan></text>
</g>
