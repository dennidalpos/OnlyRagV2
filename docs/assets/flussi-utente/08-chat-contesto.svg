<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1260" viewBox="0 0 360 1260" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">08 · Fare domande con o senza documenti</title>
<desc id="desc">Per interrogare documenti selezionali in Contesto LanceDB o collegali con @; Aggiorna Documenti aggiorna l’elenco. Senza selezione puoi inviare la domanda, ma non stai interrogando il corpus documentale. Scrivi la richiesta, anche da Domande Rapide, e premi Invia o Invio; Shift+Invio aggiunge una riga. Opzioni Prompt e Personalizza System Prompt consentono di regolare contesto e istruzioni. Durante la generazione usa Ferma per interrompere. La risposta risultante è incompleta. In caso di contesto bloccato, selezione assente o servizio indisponibile, correggi il problema e invia nuovamente la domanda. Se appare un avviso di contesto parziale, le parti omesse non sono visibili al modello: riduci la selezione o fai domande più mirate. Per una risposta completata passa a 09.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
