<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="25" font-size="14" letter-spacing="0.5" fill="#526779">ONLYRAG V2 / GUIDA UTENTE</text>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">08 · Fare domande con o senza</tspan><tspan x="180" y="74">documenti</tspan></text>
<g id="n0" data-node="s">
<rect x="46" y="122" width="268" height="64" rx="30" fill="#183249" stroke="#183249" stroke-width="1.3"/>
