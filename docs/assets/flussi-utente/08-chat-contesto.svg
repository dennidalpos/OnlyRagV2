<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="737.5">Risposta</tspan><tspan x="180" y="758.5">completata?</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="870" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="894.5">Leggi risposta e avvisi;</tspan><tspan x="180" y="915.5">verifica le fonti → 09</tspan></text>
</g>
