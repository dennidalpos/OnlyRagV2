<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1086" viewBox="0 0 360 1086" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">10 · Gestire e salvare le conversazioni</title>
<desc id="desc">Nella cronologia seleziona una conversazione per riaprirla, usa Rinomina e Salva per cambiarne il titolo o Annulla per abbandonare la rinomina. Nuova Chat crea una conversazione. Nel comando dell’intestazione, se compare la richiesta di azzeramento, Svuota Chat apre la nuova conversazione: quella precedente resta nello storico se il salvataggio è riuscito. Annulla mantiene aperta la conversazione corrente. Elimina conversazione rimuove la conversazione selezionata: non presumere una conferma aggiuntiva o un cestino. Copia prima ciò che serve. Con errore di lettura o salvataggio premi Riprova salvataggio. Se persiste, tieni aperta l’app e usa Copia Messaggio per conservare il contenuto importante.</desc>
