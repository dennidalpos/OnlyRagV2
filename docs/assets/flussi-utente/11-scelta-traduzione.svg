<svg xmlns="http://www.w3.org/2000/svg" width="360" height="898" viewBox="0 0 360 898" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">11 · Scegliere il tipo di traduzione</title>
<desc id="desc">Per tradurre il testo estratto e confrontarlo nell’editor scegli Traduzione Testo &amp; Markdown e passa a 12. Per generare un nuovo PDF o DOCX mantenendo la struttura del documento scegli Traduzione Layout Preservato (PDF / DOCX) e passa a 13. Se non c’è un file compatibile, importalo con 02. Imposta Lingua Sorgente, Lingua Destinazione e un modello esplicito; Inverti scambia le lingue. Le due modalità condividono le lingue e consentono un solo job alla volta.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
