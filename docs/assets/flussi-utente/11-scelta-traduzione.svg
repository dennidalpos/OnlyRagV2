<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">11 · Scegliere il tipo di</tspan><tspan x="180" y="74">traduzione</tspan></text>
<g id="n0" data-node="s">
