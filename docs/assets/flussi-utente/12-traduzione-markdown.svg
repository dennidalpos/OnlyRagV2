<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1072" viewBox="0 0 360 1072" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">12 · Tradurre testo e Markdown</title>
<desc id="desc">Seleziona il documento, lingue e modello. Scegli Singola Pagina o Tutto il Documento: con una sola pagina selezionata traduci quell’ambito, non l’intero documento. Premi Avvia Traduzione. Interrompi ferma il lavoro; un errore o un risultato incompleto non permette l’esportazione. Correggi la causa e avvia una nuova traduzione. Confronta Vista Affiancata e Vista Differenze; usa Scroll Sincronizzato, zoom e a capo secondo necessità. Controlla che lingua e contenuti siano corretti. Con risultato completo usa Copia Traduzione, Esporta PDF, Esporta DOCX o Esporta Markdown. Controlla il messaggio finale: un’esportazione annullata o fallita va ripetuta. Nuova Traduzione azzera la selezione e il risultato.</desc>
