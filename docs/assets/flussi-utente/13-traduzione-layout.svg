<svg xmlns="http://www.w3.org/2000/svg" width="360" height="952" viewBox="0 0 360 952" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">13 · Tradurre PDF o DOCX con layout</title>
<desc id="desc">Scegli un documento PDF o DOCX compatibile e imposta le lingue. Seleziona la Cartella di Destinazione (Obbligatoria) con Sfoglia Cartella…; Resetta cartella rimuove quella scelta. Premi Avvia Traduzione con Layout Preservato e segui il progresso. Annulla diventa utilizzabile quando il job è identificato: attendi il messaggio di annullamento o l’esito finale. Con successo viene indicato il nome della nuova copia nella destinazione scelta. Aprila e confronta testo, tabelle e impaginazione con l’originale. Con errore o annullamento non considerare il lavoro completo. Leggi l’esito prima di riprovare; una richiesta arrivata troppo tardi può incontrare un job già completato.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
