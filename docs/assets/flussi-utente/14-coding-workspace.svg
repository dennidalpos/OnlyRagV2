<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1071" viewBox="0 0 360 1071" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">14 · Scegliere progetto e modalità</title>
<desc id="desc">Usa Apri Cartella Workspace per agganciare il progetto; annullare il dialogo non seleziona una nuova cartella. Controlla Progetto Attivo prima di inviare richieste. Standalone (Lavoro libero) indica che non hai agganciato un progetto: da Workspace Explorer puoi mostrarne la cartella in Esplora file, esportarne una copia o svuotarla. Scegli Chiedi (Solo lettura / Ask) per analisi senza modificare file né eseguire comandi; Guidata per revisionare le azioni che cambiano il workspace; Auto per eseguirle nei limiti dei permessi scelti. Da Opzioni Prompt allega documenti ingeriti; usa Pin sui file per includerli nel contesto e Unpin o la rimozione dell’allegato per escluderli. Configura i permessi con 24 e prepara la richiesta in 15.</desc>
