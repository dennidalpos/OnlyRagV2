<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1239" viewBox="0 0 360 1239" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">15 · Pianificare oppure eseguire</title>
<desc id="desc">Scrivi cosa vuoi ottenere, i vincoli e come verificarlo. Avvia Task (freccia di invio) o Invio avvia la richiesta secondo la modalità corrente; Pianifica, disponibile in Guidata e Auto, apre il percorso di preparazione prima dell’esecuzione. In Chiedi usa direttamente Avvia Task per ottenere l’analisi. Se vengono richiesti ambito o Scelte per il piano, conferma ogni alternativa oppure usa Risposta libera. Accetta tutti i consigli è una scelta esplicita; poi premi Conferma e Genera Piano. Controlla risultato atteso, decisioni, assunzioni, file, verifiche e permessi. Usa Modifica risultato, file, check e permessi e Salva revisione per correggere il piano, oppure Annulla piano per fermarti. Approva &amp; Esegui Task avvia il piano; Esegui piano approvato riavvia quello approvato quando disponibile. Con pianificazione incompleta usa Riprova conservando richiesta e decisioni; Annulla interrompe il flusso di preparazione.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
