<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1233" viewBox="0 0 360 1233" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">16 · Approvare un’azione dell’agente</title>
<desc id="desc">Quando appare Approvazione Richiesta, leggi operazione, motivi e modifiche proposte; seleziona le porzioni approvabili se la finestra le presenta. Approva ed Esegui autorizza l’azione mostrata. Rifiuta nega quell’azione: controlla i messaggi successivi, perché non equivale necessariamente ad arrestare l’intero task. Se non viene richiesta approvazione, l’esecuzione segue modalità e permessi acquisiti per la run. Per fermare l’attività usa Arresta e controlla gli effetti con 17.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
<rect width="360" height="1233" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="25" font-size="14" letter-spacing="0.5" fill="#526779">ONLYRAG V2 / GUIDA UTENTE</text>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">16 · Approvare un’azione</tspan><tspan x="180" y="74">dell’agente</tspan></text>
<g id="n0" data-node="s">
<rect x="46" y="122" width="268" height="64" rx="30" fill="#183249" stroke="#183249" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#ffffff"><tspan x="180" y="154">Controlla azione e permessi</tspan></text>
</g>
<g id="n1" data-node="q">
<polygon points="180,242 296,308 180,374 64,308" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="297.5">Approvazione</tspan><tspan x="180" y="318.5">richiesta?</tspan></text>
</g>
<g id="n2" data-node="a">
<rect x="46" y="430" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="454.5">Leggi operazione, motivi e</tspan><tspan x="180" y="475.5">differenze proposte</tspan></text>
</g>
<g id="n3" data-node="q">
<polygon points="180,556 296,622 180,688 64,622" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="622">La autorizzi?</tspan></text>
</g>
<g id="n4" data-node="a">
<rect x="46" y="744" width="268" height="64" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="776">Approva ed Esegui</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="864" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="888.5">Segui esecuzione e</tspan><tspan x="180" y="909.5">verifiche → 17</tspan></text>
</g>
<g id="n6" data-node="t">
<rect x="46" y="990" width="268" height="91" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="1014.5">Rifiuta: azione non</tspan><tspan x="180" y="1035.5">autorizzata; controlla il</tspan><tspan x="180" y="1056.5">seguito</tspan></text>
</g>
<g id="n7" data-node="t">
<rect x="46" y="1137" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="1161.5">L’agente procede nei</tspan><tspan x="180" y="1182.5">permessi della run → 17</tspan></text>
</g>
