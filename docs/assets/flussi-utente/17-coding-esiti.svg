<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1239" viewBox="0 0 360 1239" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">17 · Controllare esiti e ripristinare file</title>
<desc id="desc">Durante il task Arresta richiede l’interruzione; attendi l’esito. Consulta Evidenze finali, File Modificati, Diff Monaco e l’output del Terminale. Distingui una verifica Superata, Fallita o Non disponibile. Una dichiarazione dell’assistente non sostituisce i risultati dei controlli. Per modifiche manuali usa l’editor e Salva File (Ctrl+S); se il file è cambiato su disco nel frattempo, scegli Ricarica, Unisci o Sovrascrivi. Il terminale permette comandi con Esegui, soggetti ai controlli applicabili. Se disponibile, Ripristina lo stato precedente propone il recupero da checkpoint. Leggi la conferma: riporta i file coperti allo stato precedente e rimuove quelli creati dalla run. Conferma solo se è ciò che vuoi, oppure annulla. Dopo il ripristino controlla conferma, errori ed effetti residui. Se conservi le modifiche, verifica il risultato prima di inviare un’altra richiesta.</desc>
