<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1218" viewBox="0 0 360 1218" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">18 · Gestire sessioni e storico progetto</title>
<desc id="desc">Nel progetto seleziona una sessione oppure crea una Nuova Sessione Progetto; controlla progetto e sessione prima di riusare una richiesta. Nuova chat avvia una nuova conversazione nel contesto previsto. Usa Storico Prompt Progetto o Cerca nello storico prompt di tutti i progetti per trovare richieste e relativi esiti. Rivedi il testo prima di eseguirlo nuovamente. Per eliminare una sessione o Svuota storico progetto, leggi e conferma la richiesta mostrata; annulla per conservarla. Controlla il risultato e passa a 19 se compare un avviso di recupero. Con Impossibile leggere o salvare sessioni o progetti, tieni aperta la vista e usa Riprova archiviazione; i percorsi aggiuntivi di recupero sono in 19.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
