<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="272.5">Apri una sessione oppure</tspan><tspan x="180" y="293.5">Nuova Sessione Progetto</tspan></text>
</g>
