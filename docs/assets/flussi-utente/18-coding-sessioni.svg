<polygon points="180,374 296,440 180,506 64,440" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="429.5">Vuoi eliminare</tspan><tspan x="180" y="450.5">lo storico?</tspan></text>
</g>
<g id="n3" data-node="a">
<rect x="46" y="562" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
