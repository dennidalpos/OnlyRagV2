</g>
<g id="n4" data-node="q">
<polygon points="180,688 296,754 180,820 64,754" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="754">Confermi?</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="876" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="900.5">Controlla l’esito;</tspan><tspan x="180" y="921.5">eventuale recupero → 19</tspan></text>
</g>
<g id="n6" data-node="t">
