<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">18 · Gestire sessioni e storico</tspan><tspan x="180" y="74">progetto</tspan></text>
<g id="n0" data-node="s">
<rect x="46" y="122" width="268" height="70" rx="30" fill="#183249" stroke="#183249" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#ffffff"><tspan x="180" y="146.5">Controlla progetto e</tspan><tspan x="180" y="167.5">sessione attivi</tspan></text>
</g>
