<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1113" viewBox="0 0 360 1113" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">19 · Recuperare storico e cancellazioni</title>
<desc id="desc">Per una copia dello storico che richiede recupero, scegli Riprova storico o Esporta copia, seleziona una cartella e controlla il risultato. Annullare il dialogo non crea una copia. Per una cancellazione in attesa, Riprova cancellazione è disponibile solo nello stato previsto. Ripristina sessione recupera la sessione quando abilitato; Esporta recupero conserva una copia per la verifica. Se la preparazione è incompleta, esporta il recupero: riprova e ripristino sono disabilitati. Una cancellazione già completata può ancora esporre la copia conservata per ripristino o esportazione. Dopo ogni azione controlla conferma o errore e il percorso indicato. Se il recupero viene rifiutato, conserva i dati; Mostra altre operazioni di recupero visualizza eventuali record aggiuntivi.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
