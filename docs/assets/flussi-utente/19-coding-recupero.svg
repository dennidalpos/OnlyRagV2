<polygon points="180,242 296,308 180,374 64,308" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="297.5">Riguarda lo</tspan><tspan x="180" y="318.5">storico?</tspan></text>
</g>
<g id="n2" data-node="a">
<rect x="46" y="430" width="268" height="70" rx="0" fill="#edf4fb" stroke="#527b9c" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="454.5">Riprova storico oppure</tspan><tspan x="180" y="475.5">Esporta copia</tspan></text>
</g>
<g id="n3" data-node="t">
<rect x="46" y="556" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="580.5">Controlla conferma,</tspan><tspan x="180" y="601.5">percorso o rifiuto</tspan></text>
</g>
<g id="n4" data-node="q">
<polygon points="180,682 296,748 180,814 64,748" fill="#fff3d6" stroke="#976400" stroke-width="1.4"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="400" fill="#183249"><tspan x="180" y="737.5">Preparazione</tspan><tspan x="180" y="758.5">incompleta?</tspan></text>
</g>
<g id="n5" data-node="t">
<rect x="46" y="870" width="268" height="70" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="894.5">Esporta recupero; conserva</tspan><tspan x="180" y="915.5">originali e staging</tspan></text>
</g>
<g id="n6" data-node="t">
<rect x="46" y="996" width="268" height="91" rx="30" fill="#e7f3ed" stroke="#366650" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#183249"><tspan x="180" y="1020.5">Riprova cancellazione o</tspan><tspan x="180" y="1041.5">Ripristina sessione, se</tspan><tspan x="180" y="1062.5">abilitati; oppure esporta</tspan></text>
</g>
