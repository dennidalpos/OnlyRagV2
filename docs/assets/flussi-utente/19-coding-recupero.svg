<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#183249"><tspan x="180" y="53">19 · Recuperare storico e</tspan><tspan x="180" y="74">cancellazioni</tspan></text>
<g id="n0" data-node="s">
<rect x="46" y="122" width="268" height="64" rx="30" fill="#183249" stroke="#183249" stroke-width="1.3"/>
<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="400" fill="#ffffff"><tspan x="180" y="154">Leggi il banner e lo stato</tspan></text>
</g>
