<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1036" viewBox="0 0 360 1036" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">20 · Gestire skill e sorgenti</title>
<desc id="desc">Apri Skill Hub. In Skill Installate puoi cercare, leggere e copiare le istruzioni, modificarle, usare Ripristina Originale quando disponibile o confermare Elimina. Per aggiungere capacità usa Marketplace &amp; Hub e Installa, Importa da URL con un documento SKILL.md, oppure Crea Skill con nome, descrizione, trigger e istruzioni. Leggi il contenuto prima di salvarlo o installarlo. Aggiungi Hub aggiunge una sorgente personalizzata; la rimozione della sorgente ha una conferma distinta. Non equivale alla rimozione delle skill già installate. Con discovery attiva, se l’agente propone una skill, scegli Installa oppure Rifiuta nella richiesta. Se fallisce, leggi l’errore; se annulli la creazione o l’importazione, torna alle skill senza considerare completato l’inserimento.</desc>
