<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1092" viewBox="0 0 360 1092" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">21 · Preferenze, cartelle e prompt</title>
<desc id="desc">In Preferenze &amp; Interfaccia Utente regola Lingua Interfaccia, a capo ed Effetti Sonori. Excel: dimensioni del formato amplia le dimensioni ammesse per la richiesta di ingestione; l’estratto RAG resta limitato. In Directory e File di Output scegli la Cartella Output Traduzioni con Sfoglia…. Rimuovi elimina la preferenza della cartella, non i file già esportati. Apri Cartella Log apre la cartella dei log. Per personalizzare le istruzioni apri System Prompt nella funzione interessata, seleziona il prompt, rivedi testo e anteprima e premi Salva. Correggi gli errori che bloccano il salvataggio; chiudi per abbandonare la bozza non salvata. Ripristina default rimuove una personalizzazione dopo conferma. Le preferenze si salvano automaticamente: controlla Impostazioni salvate. Con errore usa Riprova e attendi la conferma prima di chiudere.</desc>
