<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1359" viewBox="0 0 360 1359" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">22 · Scegliere e collegare Ollama</title>
<desc id="desc">In Server Ollama (Locale o Rete) scegli Sullo stesso PC (Locale) oppure Server in Rete Remoto e inserisci il relativo indirizzo. Nel percorso locale Avvia / Installa Ollama tenta l’avvio del processo. Se apre la pagina ufficiale, completa manualmente download e installazione nel browser; poi ripeti il controllo. Premi Test Connessione Server. Con esito positivo passa a 23; se non raggiungibile controlla servizio, indirizzo e accessibilità della porta, quindi riprova. In modalità remota puoi anche usare Riprova server o Configura server nella barra laterale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#526779"/></marker></defs>
