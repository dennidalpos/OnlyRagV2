<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1245" viewBox="0 0 360 1245" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">23 · Modelli, assegnazioni e OCR</title>
<desc id="desc">Usa Setup Wizard Hardware &amp; Modelli per esaminare hardware e proposte oppure inserisci il nome in Scarica Modello. Attendi l’esito; con errore correggi la causa e riprova. Assegna i modelli ai ruoli richiesti: Coding, Chat/RAG, Traduzione, Vision/OCR ed Embedding; quelli specialistici sono opzionali. Un modello selezionato ma non installato non è pronto all’uso. Scegli OCR Nativo (RapidOCR / ONNX) o Vision LLM Multimodale (Ollama Vision). L’OCR nativo mostra GPU ON / RapidOCR (CUDA) o CPU / RapidOCR (CPU) solo con Sidecar online (provider in verifica in avvio o offline). Regola contesto e, dove disponibili, Thinking e Campionamento per il Coding Agent. Verifica Aggiornamenti cerca nuove versioni; Update now le scarica. Attendi la fine prima di usare un modello in aggiornamento. Scarica RAM libera il modello in esecuzione; Elimina Modello richiede conferma e ne rimuove i pesi. Dopo download o modifica aggiorna l’elenco, controlla le assegnazioni e la conferma di salvataggio, quindi torna alla funzione.</desc>
