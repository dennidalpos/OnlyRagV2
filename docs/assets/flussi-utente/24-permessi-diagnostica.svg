<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1009" viewBox="0 0 360 1009" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">24 · Permessi e limiti dell’agente</title>
<desc id="desc">In Permessi Agent Coding scegli i predefiniti per le nuove run; dal Coding Agent Permessi agente permette di distinguere i predefiniti dal Piano corrente. Se il piano non è pronto, i relativi controlli non sono disponibili. Nel profilo limitato imposta Modifiche ai file, Comandi terminale e Rete (Bloccata, Solo locale, Con approvazione). Imposta il Budget di step o scegli esplicitamente Illimitato. Salva i permessi del piano quando richiesto e controlla l’esito. Full access e installazioni libere consente azioni più ampie, incluse modifiche fuori dal progetto, comandi, installazioni e commit senza conferme previste dal profilo limitato. Leggi il testo dell’opzione prima di attivarla; per conservare limiti espliciti lasciala disattivata. Per esaminare un problema e gestire i log segui il percorso 25. Se il salvataggio fallisce usa la riprova disponibile; non considerare applicati i permessi di un piano non salvato. Le scelte della run attiva non cambiano retroattivamente modificando i predefiniti.</desc>
