<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1371" viewBox="0 0 360 1371" role="img" aria-labelledby="title desc" xml:lang="it">
<title id="title">25 · Diagnosticare un problema e gestire i log</title>
<desc id="desc">Apri Console Log dalla barra laterale, Apri Cartella Log dalle Impostazioni oppure la diagnostica del Coding Agent per leggere stato, risorse ed errori. In Console Log puoi filtrare i log, usare Copia Report, Pulisci Log per azzerare il buffer della console o Riavvia Sidecar quando il Sidecar è offline. Per registrare ulteriori dettagli delle prossime run attiva Log Debug Coding Agent e scegli File conservati. Riproduci soltanto il problema necessario e consulta i dati raccolti; attivare il debug non recupera payload che non erano stati registrati. Conserva i log se ti servono per correggere la causa e riprovare. Se vuoi pulire il log di audit dell’agente, copia prima quanto serve e premi Pulisci log agente: la pulizia parte senza una seconda conferma. Controlla il segno di conferma accanto al pulsante. Se manca, non dare per riuscita la pulizia. Chiudere la console non cancella il log e pulire il log non corregge la causa dell’errore.</desc>
